<div id="coax-ground-explainer">
  <div class="viz-controls" aria-label="Connection views">
    <button class="btn" type="button" data-view="assembly" aria-pressed="true">Whole connection</button>
    <button class="btn" type="button" data-view="layers" aria-pressed="false">Inside the cable</button>
    <button class="btn" type="button" data-view="clip" aria-pressed="false">Clip screw</button>
    <button class="btn" type="button" data-view="anchor" aria-pressed="false">Body screw</button>
  </div>
  <div class="coax-layout">
    <svg class="coax-drawing" viewBox="0 0 300 370" role="img" aria-label="Simplified coax grounding assembly"><title>Coax grounding connection</title><g id="coax-scene"></g></svg>
    <div class="coax-key" aria-live="polite" id="coax-labels"></div>
  </div>
  <div class="text-small text-muted">Simplified R06 connection diagram · shapes and spacing are explanatory, not manufacturing dimensions.</div>
</div>
<style>
  #coax-ground-explainer { --edge:color-mix(in srgb,var(--foreground) 65%,var(--background)); --metal:color-mix(in srgb,var(--foreground) 10%,var(--background)); --gnd:var(--viz-series-1); --hot:var(--viz-series-2); }
  #coax-ground-explainer .coax-layout { display:grid; grid-template-columns:minmax(0,360px) minmax(0,1fr); align-items:center; gap:calc(var(--font-size-base)*1.5); margin-block:calc(var(--font-size-base)*1); }
  #coax-ground-explainer .coax-drawing { display:block; width:100%; max-width:360px; color:var(--foreground); font:inherit; }
  #coax-ground-explainer .coax-key { display:grid; gap:calc(var(--font-size-base)*1); }
  #coax-ground-explainer .coax-key strong { font-weight:500; }
  #coax-ground-explainer .coax-drawing text { fill:var(--foreground); font:inherit; }
  #coax-ground-explainer .leader { fill:none; stroke:var(--edge); stroke-width:1; }
  #coax-ground-explainer .metal { fill:var(--metal); stroke:var(--edge); stroke-width:1; }
  #coax-ground-explainer .ground { fill:color-mix(in srgb,var(--gnd) 20%,var(--background)); stroke:var(--gnd); stroke-width:2; }
  #coax-ground-explainer .live { fill:color-mix(in srgb,var(--hot) 25%,var(--background)); stroke:var(--hot); stroke-width:2; }
  #coax-ground-explainer .insulation { fill:var(--background); stroke:var(--edge); stroke-width:1; }
  @media(max-width:590px) { #coax-ground-explainer .coax-layout { grid-template-columns:minmax(0,1fr); gap:var(--font-size-base); } #coax-ground-explainer .coax-drawing { margin-inline:auto; } }
</style>
<script>
(() => {
 const root=document.getElementById('coax-ground-explainer');
 const scene=root.querySelector('#coax-scene');
 const labels=root.querySelector('#coax-labels');
 const leader=(d)=>`<path class="leader" d="${d}"/>`;
 const text=(x,y,s)=>`<text x="${x}" y="${y}">${s}</text>`;
 const screw=(x,y)=>`<g transform="translate(${x} ${y})"><rect class="metal" x="-8" y="0" width="16" height="9"/><rect class="metal" x="-3" y="9" width="6" height="34"/><path class="leader" d="M-5 4H5 M-4 19L4 16 M-4 26L4 23 M-4 33L4 30"/></g>`;
 const arrow=(d)=>`<path d="${d}" fill="none" stroke="var(--gnd)" stroke-width="2" marker-end="url(#coax-arrow)"/>`;
 const defs='<defs><marker id="coax-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5 1 9" fill="none" stroke="var(--gnd)" stroke-width="1.5"/></marker><pattern id="coax-braid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0L8 8M8 0L0 8" stroke="var(--gnd)" stroke-width=".8"/></pattern></defs>';
 const views={
 assembly:{
  svg:`<rect class="metal" x="223" y="150" width="48" height="120"/><path class="ground" d="M149 177H229V198H171V257H149Z"/><rect x="93" y="30" width="42" height="100" rx="3" fill="var(--foreground)"/><rect class="ground" x="96" y="130" width="36" height="64"/><rect x="96" y="130" width="36" height="64" fill="url(#coax-braid)"/><path class="insulation" d="M105 194V253Q105 285 145 285H166V265H145Q123 265 123 253V194Z"/><path d="M113 199V251Q113 274 145 274H172" fill="none" stroke="var(--hot)" stroke-width="5"/><path class="ground" d="M87 148V192H142V148H133V182H96V148Z"/><circle class="metal" cx="151" cy="191" r="8"/><path class="leader" d="M146 191H156"/><circle class="metal" cx="217" cy="184" r="7"/><path class="leader" d="M212 184H222"/><rect class="live" x="175" y="259" width="22" height="53"/><ellipse class="live" cx="178" cy="274" rx="13" ry="7"/><rect class="live" x="158" y="312" width="75" height="20"/>${text(20,70,'A')}${leader('M37 66H90')}${text(20,160,'B')}${leader('M37 156H83')}${text(184,120,'C')}${leader('M190 126V174')}${text(273,207,'D')}${text(68,292,'E')}${leader('M82 288L107 263')}${text(242,321,'F')}${leader('M239 316H234')}${arrow('M114 140V164')}${arrow('M165 187H204')}`,
  labels:[['A · Cable jacket','The protective outer plastic ends above the clip.'],['B · Exposed braid + spring clip','The clip presses directly on the cable’s metal outer shield.'],['C · Conductive carrier','A small metal bracket connects the clip to the body.'],['D · Grounded body / Boden','The carrier’s saddle seats against this metal body.'],['E · Insulated centre tail','The live centre continues beyond the shield; insulation and the added guard keep it separate.'],['F · Separate live terminal','Ring lug → copper stand-off → copper backplate → target.']]
 },
 layers:{
  svg:`<rect x="100" y="26" width="58" height="112" rx="3" fill="var(--foreground)"/><rect class="ground" x="106" y="138" width="46" height="74"/><rect x="106" y="138" width="46" height="74" fill="url(#coax-braid)"/><rect class="insulation" x="116" y="212" width="26" height="66"/><rect class="live" x="125" y="278" width="8" height="53"/>${text(20,72,'A')}${leader('M37 68H97')}${text(20,171,'B')}${leader('M37 167H102')}${text(20,243,'C')}${leader('M37 239H113')}${text(20,306,'D')}${leader('M37 302H121')}<path class="ground" d="M92 152V202H166V152H155V190H103V152Z"/>${text(183,174,'Clip')}${leader('M179 178H169')}${text(40,359,'Stepped cutaway of the layers')}`,
  labels:[['A · Outer jacket','Plastic protection. It does not make the electrical ground contact.'],['B · Outer shield / braid','This metal layer is the grounded part of the coax. Exposing a band lets the spring clip touch it.'],['C · Centre dielectric','Insulation remains around the live centre as it leaves the braid termination.'],['D · Centre conductor','This is the separate live RF connection. It goes to the ring lug, not to the ground clip.']]
 },
 clip:{
  svg:`${screw(113,38)}${text(147,61,'A')}${leader('M139 57H124')}<path class="ground" d="M72 118V167H159V118H148V155H83V118Z"/><circle class="insulation" cx="113" cy="160" r="5"/>${text(185,146,'B')}${leader('M177 142H163')}<path class="ground" d="M70 212H159V228H143V257H126V228H70Z"/><ellipse class="insulation" cx="113" cy="219" rx="7" ry="4"/>${text(185,228,'C')}${leader('M178 224H163')}<path class="metal" d="M102 297L108 290H119L125 297V309L119 315H108L102 309Z"/><circle class="insulation" cx="113" cy="302" r="4"/>${text(151,306,'D')}${leader('M144 302H130')}<path class="leader" stroke-dasharray="3 5" d="M113 84V113M113 174V205M113 234V283"/>${text(35,358,'Exploded clip-to-carrier joint')}`,
  labels:[['A · M3 × 4 screw','The short screw belongs to the clip joint.'],['B · Spring clip','Its jaws grip the exposed shield band. The cable is omitted here so you can see the mounting joint.'],['C · Ground carrier','The clip mounts onto this conductive support.'],['D · Separate nut','The screw and nut secure the clip to the carrier. This joint does not anchor the carrier to the gun body.']]
 },
 anchor:{
  svg:`${screw(116,40)}${text(151,65,'A')}${leader('M143 61H128')}<path class="ground" d="M70 141H155L176 166V190H154V175L143 163H70Z"/><ellipse class="insulation" cx="116" cy="153" rx="7" ry="4"/>${text(203,164,'B')}${leader('M196 160H177')}<path class="metal" d="M64 236H220V324H64Z"/><path d="M110 236V277H122V236" fill="var(--background)" stroke="var(--edge)"/><path class="leader" stroke-dasharray="3 5" d="M116 87V134M116 170V226"/>${text(238,263,'C')}${leader('M232 259H224')}${text(94,304,'Blind hole')}${text(26,354,'Exploded carrier-to-body joint')}`,
  labels:[['A · M3 × 6 anchor screw','This is a different screw from the clip’s M3 × 4 screw.'],['B · Carrier mounting tab + saddle','The anchor holds the shaped carrier against its metal seat on the body.'],['C · Grounded body / Boden','The anchor enters a blind receiving hole: the hole stops inside the body.'],['Electrical contact','Carrier saddle ↔ body contact seat. The screw maintains this joint. The actual anchor is inclined; this view straightens it for clarity.']]
 }
 };
 function render(key,save=false){
  if(!Object.hasOwn(views,key))key='assembly';
  scene.innerHTML=defs+views[key].svg;
  labels.replaceChildren(...views[key].labels.map(([title,detail])=>{const item=document.createElement('div');const strong=document.createElement('strong');strong.textContent=title;const p=document.createElement('p');p.textContent=detail;item.append(strong,p);return item;}));
  root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===key)));
  if(save && window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{coaxGroundView:key},privateContent:null}).catch(()=>{});
 }
 root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.view,true)));
 render(window.openai?.widgetState?.modelContent?.coaxGroundView||'assembly');
 window.addEventListener('openai:set_globals',e=>{const state=e.detail?.globals?.widgetState;if(state)render(state.modelContent?.coaxGroundView||'assembly');});
})();
</script>
